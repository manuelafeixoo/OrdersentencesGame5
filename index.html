        /* Base Kid-Friendly Styles */

            padding: 10px;

            font-size: 2rem;
            text-align: center;
        }

        /* Setup Screen */
        .setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-top: 10px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .config-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .config-label {
            font-size: 1rem;
            font-weight: bold;
            color: #555;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .mode-btn {
            padding: 8px 15px;
            border: 3px solid #81d4fa;
            background: white;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            color: #0d47a1;
        }

        .mode-btn.selected {
            background: #baffc9;
            border-color: #2e7d32;
        }

        .player-setup-box {
            background: #f0f7ff;
            border: 3px solid #bae1ff;
            border-radius: 20px;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .player-setup-box input {
            padding: 6px 10px;
            font-size: 1rem;
            border: 2px solid #81d4fa;
            border-radius: 10px;
            width: 80%;
            font-family: inherit;
            text-align: center;
        }

        .avatar-selector {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .avatar-option {
            font-size: 1.3rem;
            padding: 3px 5px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }

        .avatar-option:hover {
            transform: scale(1.1);
        }

        .avatar-option.selected {
            background: #baffc9;
            border-color: #2e7d32;
            transform: scale(1.15);
        }

        /* Stats Bar */
        .stats-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .timer-display {
            background: #ffebee;
            color: #c62828;
            padding: 3px 12px;
            border-radius: 15px;
            border: 2px solid #ef9a9a;
            display: none;
        }

        .scores-container {
            display: flex;
            gap: 15px;
        }

        .score-counter {
            background: #f1f1f1;
            padding: 8px 18px;
            border-radius: 25px;
            border: 3px solid #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            opacity: 0.7;
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .score-counter.active-player {
            background: #fff9c4;
            border-color: #fbc02d;
            box-shadow: 0 0 15px rgba(251, 192, 45, 0.6);
            opacity: 1;
            transform: scale(1.1);
        }

        .game-container {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            gap: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Word Bank Area */
        .word-bank {
            position: relative;
            width: 100%;
            height: 200px; 
            background-color: #e0f7fa;
            border: 4px dashed #81d4fa;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .word-bank::before {
            content: 'Word Bank (Drag or Click words)';
            position: absolute;
            top: 10px;
            left: 15px;
            color: #81d4fa;
            font-weight: bold;
            font-size: 1rem;
            pointer-events: none;
        }

        /* Drop Zone (Sentence Area) */
        .drop-zone {
            min-height: 80px; 
            background-color: #fff9c4;
            border: 4px dashed #fff176;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            transition: background-color 0.3s;
        }

        .drop-zone.drag-over {
            background-color: #fffae6;
            border-color: #ffeb3b;
        }

        /* Word Cards */
        .word-card {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #444;
            cursor: pointer; 
            user-select: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s;
            touch-action: manipulation; 
        }

        .word-card:active {
            transform: scale(0.95);
        }

        .word-card.dragging {
            opacity: 0.5;
            box-shadow: none;
        }

        .in-bank {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
        }

        .in-drop-zone {
            position: relative;
            transform: none !important;
            top: auto;
            left: auto;
            box-shadow: 0 3px 0 rgba(0,0,0,0.15);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 5px;
        }

            border-radius: 25px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);

            font-size: 1.2rem;
            font-weight: bold;

</head>

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(330, now);
                oscillator.frequency.setValueAtTime(392, now + 0.1);
                oscillator.frequency.setValueAtTime(523.25, now + 0.2);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                
                oscillator.start(now);
                oscillator.stop(now + 0.4);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(180, now);
                oscillator.frequency.setValueAtTime(120, now + 0.15);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'skip') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.setValueAtTime(400, now + 0.1);
                
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                
                oscillator.start(now);
                oscillator.stop(now + 0.2);
            }
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        btnStartGame.addEventListener('click', () => {
            const p1Input = document.getElementById('player1-name').value.trim();
            const p2Input = document.getElementById('player2-name').value.trim();
            
            if (p1Input) playerNames[1] = p1Input;
            if (p2Input) playerNames[2] = p2Input;

            p1Label.innerText = playerNames[1];
            p1Icon.innerText = playerIcons[1];
            p1ScoreBox.style.display = 'flex';

            if (totalPlayers === 2) {
                p2Label.innerText = playerNames[2];
                p2Icon.innerText = playerIcons[2];
                p2ScoreBox.style.display = 'flex';
            } else {
                p2ScoreBox.style.display = 'none';
            }

            if (timerEnabled) {
                timerBox.style.display = 'block';
            } else {
                timerBox.style.display = 'none';
            }

            setupScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            statsBar.style.display = 'flex';

            startNewGame();
        });

        btnHome.addEventListener('click', () => {
            clearInterval(timerInterval);
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            gameContainer.style.display = 'none';
            statsBar.style.display = 'none';
            setupScreen.style.display = 'flex';
            
            const replayBtn = document.getElementById('btn-replay');
            if (replayBtn) replayBtn.remove();
        });

        function startNewGame() {
            const shuffled = shuffleArray([...allSentences]);
            currentSessionSentences = shuffled.slice(0, 10);
            
            currentRound = 0;
            activePlayer = 1;
            scores = { 1: 0, 2: 0 };
            
            p1Score.innerText = scores[1];
            p2Score.innerText = scores[2];
            
            const replayBtn = document.getElementById('btn-replay');
            if (replayBtn) replayBtn.remove();

            btnReset.style.display = 'inline-block';
            btnSkip.style.display = 'inline-block';
            btnHelp.style.display = 'inline-block';
            updateTurnDisplay();
            initLevel();
        }

        function updateTurnDisplay() {
            if (activePlayer === 1) {
                p1ScoreBox.classList.add('active-player');
                p2ScoreBox.classList.remove('active-player');
            } else {
                p2ScoreBox.classList.add('active-player');
                p1ScoreBox.classList.remove('active-player');
            }
        }

        function startTimer() {
            if (!timerEnabled) return;
            clearInterval(timerInterval);
            timeLeft = 40;
            timerCountSpan.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerCountSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound('error');
                    feedback.innerText = "⏰ Time's up! Moving to next round.";
                    feedback.style.color = "#d32f2f";
                    btnCheck.style.display = 'none';
                    btnSkip.style.display = 'none';
                    btnHelp.style.display = 'none';
                    btnNext.style.display = 'inline-block';
                }
            }, 1000);
        }

        function initLevel() {
            wordBank.innerHTML = '';
            dropZone.innerHTML = '';
            feedback.innerText = '';
            helpUsedInCurrentRound = false;
            btnNext.style.display = 'none';
            btnCheck.style.display = 'inline-block';
            btnSkip.style.display = 'inline-block';
            btnHelp.style.display = 'inline-block';
            levelDisplay.innerText = currentRound + 1;
            wordsData = [];

            const sentence = currentSessionSentences[currentRound];
            const words = sentence.split(' ').sort(() => Math.random() - 0.5);

            const bankRect = wordBank.getBoundingClientRect();

            words.forEach((word, index) => {
                const el = document.createElement('div');
                el.className = 'word-card in-bank';
                el.id = 'word-' + index;
                el.draggable = true;
                el.innerText = word;
                
                el.style.backgroundColor = pastelColors[index % pastelColors.length];
                
                el.addEventListener('dragstart', handleDragStart);
                el.addEventListener('dragend', handleDragEnd);
                el.addEventListener('click', handleWordClick);

                wordBank.appendChild(el);

                const width = el.offsetWidth;
                const height = el.offsetHeight;
                
                const x = Math.random() * Math.max(1, bankRect.width - width);
                const y = Math.random() * Math.max(1, bankRect.height - height);
                
                const speedMulti = 0.8 + Math.random() * 1.0; 
                const vx = (Math.random() > 0.5 ? 1 : -1) * speedMulti;
                const vy = (Math.random() > 0.5 ? 1 : -1) * speedMulti;

                wordsData.push({ id: el.id, el, x, y, vx, vy, width, height });
            });

            if (!animationFrameId) {
                animate();
            }

            startTimer();
        }

        function animate() {
            const bankRect = wordBank.getBoundingClientRect();

            wordsData.forEach(w => {
                if (w.el.parentElement !== wordBank || w.el.dataset.dragging === 'true') {
                    return;
                }

                w.x += w.vx;
                w.y += w.vy;

                if (w.x <= 0) { w.x = 0; w.vx = Math.abs(w.vx); }
                if (w.y <= 0) { w.y = 0; w.vy = Math.abs(w.vy); }
                if (w.x + w.width >= bankRect.width) { w.x = Math.max(0, bankRect.width - w.width); w.vx = -Math.abs(w.vx); }
                if (w.y + w.height >= bankRect.height) { w.y = Math.max(0, bankRect.height - w.height); w.vy = -Math.abs(w.vy); }

                w.el.style.transform = `translate(${w.x}px, ${w.y}px)`;
            });

            animationFrameId = requestAnimationFrame(animate);
        }

        function handleWordClick(e) {
            const el = e.target;
            if (el.parentElement === wordBank) {
                dropZone.appendChild(el);
                el.className = 'word-card in-drop-zone';
                el.style.transform = 'none';
            } else if (el.parentElement === dropZone) {
                wordBank.appendChild(el);
                el.className = 'word-card in-bank';
                const data = wordsData.find(w => w.id === el.id);
                if (data) {
                    const bankRect = wordBank.getBoundingClientRect();
                    data.x = (bankRect.width / 2) - (data.width / 2);
                    data.y = (bankRect.height / 2) - (data.height / 2);
                }
            }
        }

        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.id);
            e.target.dataset.dragging = 'true';
            setTimeout(() => e.target.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            e.target.dataset.dragging = 'false';
            e.target.classList.remove('dragging');
        }

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const id = e.dataTransfer.getData('text/plain');
            const el = document.getElementById(id);
            if (el) {
                const afterElement = getDragAfterElement(dropZone, e.clientX);
                if (afterElement == null) {
                    dropZone.appendChild(el);
                } else {
                    dropZone.insertBefore(el, afterElement);
                }
                el.className = 'word-card in-drop-zone';
                el.style.transform = 'none';
            }
        });

        wordBank.addEventListener('dragover', e => e.preventDefault());
        wordBank.addEventListener('drop', e => {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const el = document.getElementById(id);
            if (el && el.parentElement !== wordBank) {
                wordBank.appendChild(el);
                el.className = 'word-card in-bank';
                const data = wordsData.find(w => w.id === id);
                if (data) {
                    const rect = wordBank.getBoundingClientRect();
                    data.x = e.clientX - rect.left - (data.width / 2);
                    data.y = e.clientY - rect.top - (data.height / 2);
                }
            }
        });

        function getDragAfterElement(container, x) {
            const draggableElements = [...container.querySelectorAll('.word-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        btnHelp.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                helpUsedInCurrentRound = true;
                const sentenceToRead = currentSessionSentences[currentRound];
                const utterance = new SpeechSynthesisUtterance(sentenceToRead);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
                feedback.innerText = "🔊 Listening to help! (Points will be halved)";
                feedback.style.color = "#f57f17";
            } else {
                alert("Text-to-speech is not supported in your browser.");
            }
        });

        btnCheck.addEventListener('click', () => {
            const droppedWords = Array.from(dropZone.querySelectorAll('.word-card'));
            const currentAnswer = droppedWords.map(w => w.innerText).join(' ');
            const correctAnswer = currentSessionSentences[currentRound];

            if (currentAnswer === correctAnswer) {
                clearInterval(timerInterval);
                playSound('success');
                const displayName = totalPlayers === 2 ? playerNames[activePlayer] : "Great Job!";
                
                let roundPoints = helpUsedInCurrentRound ? 5 : 10;
                scores[activePlayer] += roundPoints;

                if (activePlayer === 1) p1Score.innerText = scores[1];
                else p2Score.innerText = scores[2];

                let helpTextMsg = helpUsedInCurrentRound ? " (Half points due to help!)" : "";
                feedback.innerText = `🌟 Awesome, ${displayName}! Correct! +${roundPoints}pts${helpTextMsg} 🌟`;
                feedback.style.color = "#2e7d32";
                
                btnCheck.style.display = 'none';
                btnSkip.style.display = 'none';
                btnHelp.style.display = 'none';
                btnNext.style.display = 'inline-block';
            } else {
                playSound('error');
                feedback.innerText = "Oops! That's not quite right. Try again, use Help, or Skip!";
                feedback.style.color = "#d32f2f";
            }
        });

        btnSkip.addEventListener('click', () => {
            clearInterval(timerInterval);
            playSound('skip');
            feedback.innerText = `Skipped! Correct sentence was: "${currentSessionSentences[currentRound]}"`;
            feedback.style.color = "#e65100";
            
            btnCheck.style.display = 'none';
            btnSkip.style.display = 'none';
            btnHelp.style.display = 'none';
            btnNext.style.display = 'inline-block';
        });

        btnReset.addEventListener('click', () => {
            wordsData.forEach(w => {
                if (w.el.parentElement !== wordBank) {
                    wordBank.appendChild(w.el);
                    w.el.className = 'word-card in-bank';
                    const bankRect = wordBank.getBoundingClientRect();
                    w.x = (bankRect.width / 2) - (w.width / 2);
                    w.y = (bankRect.height / 2) - (w.height / 2);
                }
            });
            feedback.innerText = "";
        });

        btnNext.addEventListener('click', () => {
            currentRound++;
            if (totalPlayers === 2) {
                activePlayer = activePlayer === 1 ? 2 : 1;
                updateTurnDisplay();
            }

            if (currentRound < currentSessionSentences.length) {
                initLevel();
            } else {
                wordBank.innerHTML = '';
                dropZone.innerHTML = '';
                timerBox.style.display = 'none';
                
                let winText = "";
                if (totalPlayers === 2) {
                    if (scores[1] > scores[2]) {
                        winText = `🏆🎉 ${playerIcons[1]} ${playerNames[1]} Wins with ${scores[1]} pts! 🎉🏆`;
                    } else if (scores[2] > scores[1]) {
                        winText = `🏆🎉 ${playerIcons[2]} ${playerNames[2]} Wins with ${scores[2]} pts! 🎉🏆`;
                    } else {
                        winText = `🤝 It's a Tie! Both scored ${scores[1]} pts! 🤝`;
                    }
                } else {
                    winText = `🎉 Congratulations! Final Score: ${scores[1]} pts! 🎉`;
                }

                feedback.innerText = winText;
                feedback.style.color = "#ff4081";
                btnNext.style.display = 'none';
                btnCheck.style.display = 'none';
                btnReset.style.display = 'none';
                btnSkip.style.display = 'none';
                btnHelp.style.display = 'none';
                
                const replayBtn = document.createElement('button');
                replayBtn.className = 'btn-check';
                replayBtn.id = 'btn-replay';
                replayBtn.innerText = 'Play Again 🔄';
                replayBtn.onclick = startNewGame;
                
                document.querySelector('.controls').appendChild(replayBtn);
            }
        });

        window.addEventListener('resize', () => {
            const bankRect = wordBank.getBoundingClientRect();
            wordsData.forEach(w => {
                if (w.x + w.width > bankRect.width) w.x = Math.max(0, bankRect.width - w.width);
                if (w.y + w.height > bankRect.height) w.y = Math.max(0, bankRect.height - w.height);
            });
        });
    </script>
</body>
</html>
